<!DOCTYPE html>
<html lang="zh-CN" data-season="spring" data-phase="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ricardo</title>
  <meta name="description" content="Ricardo 的个人网站。在南京航空航天大学读研，做微秒级任务调度。">
  <meta property="og:title" content="Ricardo">
  <meta property="og:description" content="Ricardo 的个人网站。在南京航空航天大学读研，做微秒级任务调度。">
  <meta property="og:type" content="website">
  <script>
    (function () {
      var d = document.documentElement, now = new Date(), h = now.getHours();
      var s = ["winter", "winter", "spring", "spring", "spring", "summer", "summer", "summer", "autumn", "autumn", "autumn", "winter"][now.getMonth()];
      try {
        var v = sessionStorage.getItem("farm.season");
        if (/^(spring|summer|autumn|winter)$/.test(v)) s = v;
      } catch (e) {}
      d.setAttribute("data-season", s);
      d.setAttribute("data-phase", h < 5 || h >= 19 ? "night" : h < 7 ? "dawn" : h < 17 ? "day" : "dusk");
      var l = document.createElement("link");
      l.rel = "preload";
      l.as = "image";
      l.href = "img/farm-" + s + ".png";
      document.head.appendChild(l);
    })();
  </script>
  <link rel="preload" href="fonts/ark-pixel-12px-proportional-zh_hans.otf.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/farm.css">
  <link rel="icon" href="img/favicon.png">
</head>
<body class="home">
  <a class="skip" href="#content">跳到对话</a>
  <div class="world" aria-hidden="true"></div>

  <header class="hud">
    <div class="hud-box">
      <div class="hud-sky" aria-hidden="true"><span class="hud-sun"></span></div>
      <div class="hud-lines">
        <p><time data-today>今天</time></p>
        <p><time data-clock>现在</time><button class="hud-season" type="button" data-season-cycle aria-label="换季"><span class="hud-season-icon"></span><span class="hud-season-name"></span></button></p>
      </div>
    </div>
  </header>

  <main class="stage" id="content">
    <section class="dialogue" data-type-box aria-labelledby="speaker">
      <div class="dialogue-text">
        <p class="dialogue-line" data-type>你好，我是 Ricardo。在南京航空航天大学读研，做微秒级任务调度。</p>
        <nav class="choices" aria-label="栏目">
          <a href="about/">你是做什么的？<small>关于</small></a>
          <a href="now/">最近在忙什么？<small>近况</small></a>
          <a href="work/">做过些什么？<small>作品</small></a>
          <a href="notes/">有写东西吗？<small>笔记</small></a>
          <a href="contact/">怎么联系你？<small>联系</small></a>
        </nav>
      </div>
      <div class="dialogue-face">
        <div class="portrait-box"><img src="img/portrait.png" width="144" height="144" alt=""></div>
        <h1 class="nameplate" id="speaker">Ricardo</h1>
      </div>
    </section>
  </main>

  <footer class="credit">
    <p>视觉受田园生活模拟游戏启发，非官方，与 ConcernedApe 无关。</p>
    <p><a href="about/">关于</a><a href="now/">近况</a><a href="log/">流水</a><a href="work/">作品</a><a href="notes/">笔记</a><a href="contact/">联系</a><a href="board/">告示牌</a></p>
  </footer>
  <script src="js/farm.js"></script>
</body>
</html>
