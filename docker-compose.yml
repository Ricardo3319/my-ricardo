services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - RICARDO_PASSKEY=${RICARDO_PASSKEY:-please-change-me}
      - PORT=8000
    volumes:
      - ./server/data:/app/server/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
