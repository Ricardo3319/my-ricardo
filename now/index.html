<!DOCTYPE html>
<html lang="zh-CN" data-season="spring">
<head>
  <script>
    (function () {
      var month = new Date().getMonth() + 1;
      var season = month >= 3 && month <= 5 ? "spring" : month >= 6 && month <= 8 ? "summer" : month >= 9 && month <= 11 ? "autumn" : "winter";
      var colors = { spring: "#84c669", summer: "#6eb058", autumn: "#a8b056", winter: "#cedad6" };
      try {
        var saved = localStorage.getItem("farm.season");
        if (colors[saved]) season = saved;
      } catch (e) {}
      var root = document.documentElement;
      root.setAttribute("data-season", season);
      root.style.backgroundColor = colors[season];
      var link = document.createElement("link");
      link.rel = "preload";
      link.as = "image";
      link.href = "../assets/ground-" + season + ".png";
      document.head.appendChild(link);
    })();
  </script>
  <style>
    html { color-scheme: light; background: #84c669; }
    html[data-season="summer"] { background: #6eb058; }
    html[data-season="autumn"] { background: #a8b056; }
    html[data-season="winter"] { background: #cedad6; }
    body { margin: 0; background: transparent; }
    .site-header { background: #f4ead0; border-bottom: 4px solid #5a3018; }
  </style>
